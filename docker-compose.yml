services:
  web:
    build:
      context: .
      target: runtime
      args:
        BASE_PATH: /
    image: gcc-explorer:local
    container_name: gcc-explorer
    ports:
      - "${GCCX_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # `docker compose --profile dev up` — hot reloading against the local sources.
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    container_name: gcc-explorer-dev
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "${GCCX_DEV_PORT:-5173}:5173"
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./index.html:/app/index.html:ro
      - ./tools:/app/tools:ro
      - ./data:/app/data:ro
