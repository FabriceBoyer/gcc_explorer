server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The app uses hash routing, so there are no server-side routes to rewrite;
    # anything unknown still falls back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The dataset is versioned by a hash inside manifest.json, which the client
    # revalidates on every load, so the payloads themselves can be cached hard.
    location /data/manifest.json {
        add_header Cache-Control "no-cache";
    }
    location /data/ {
        add_header Cache-Control "public, max-age=604800";
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/json application/javascript
                      application/wasm image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
