<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>GCC Explorer — every GCC option, explained and comparable</title>
    <meta
      name="description"
      content="Explore, compare and export every GCC compile and link option from GCC 8 to GCC 15. Defaults, umbrella flags, version ranges, hardening profiles and build-system export — all offline, all extracted from GCC itself."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Ctext x='16' y='23' font-family='ui-monospace,monospace' font-size='19' font-weight='700' fill='white' text-anchor='middle'%3E-f%3C/text%3E%3C/svg%3E" />
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      (() => {
        try {
          const stored = localStorage.getItem('gccx.theme');
          const dark = stored ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch { /* private mode: keep the default */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
